name: Documentation Validation

on:
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - 'scripts/check_markdown_list.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'docs/**'
      - 'scripts/check_markdown_list.py'
      - '.github/workflows/docs.yml'

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate markdown formatting
        run: |
          python scripts/check_markdown_list.py docs/
