syntax = "proto3";

package x2win;

message Envelope {
    uint64 request_id = 1;
    oneof body {
        // request BN core -> stub
        LaunchRequest launch_request = 100;
        AttachRequest attach_request = 101;
        GetTargetArchRequest get_target_arch_request = 102;
        DetachRequest detach_request = 103;
        QuitRequest quit_request = 104;
        GetProcessListRequest get_process_list_request = 105;
        ConnectServerRequest connect_server_request = 106;
        GoRequest go_request = 107;
        SetBreakpointRequest set_breakpoint_request = 108;


        // response stub -> BN core
        LaunchResponse launch_response = 300;
        AttachResponse attach_response = 301;
        GetTargetArchResponse get_target_arch_response = 302;
        DetachResponse detach_response = 303;
        QuitResponse quit_response = 304;
        GetProcessListResponse get_process_list_response = 305;
        ConnectServerResponse connect_server_response = 306;
        GoResponse go_response = 307;
        SetBreakpointResponse set_breakpoint_response = 308;

        // event stub -> BN core
        // no response required
        TargetStoppedEvent target_stopped_event = 500;
    }
}

message LaunchRequest{string path = 1; string args = 2; string working_dir = 3;}
message LaunchResponse {bool success = 1;}

message AttachRequest {uint32 pid = 1;}
message AttachResponse {bool success = 1;}

message GetTargetArchRequest {}
message GetTargetArchResponse {string architecture = 1;}

message DetachRequest {}
message DetachResponse { bool success = 1;}

message QuitRequest {}
message QuitResponse { bool success = 1;}

message GetProcessListRequest {}
message GetProcessListResponse { repeated ProcessInfo processes = 1;}
message ProcessInfo {uint32 pid = 1; string name = 2;}

message ConnectServerRequest {}
message ConnectServerResponse {bool success = 1;}

// Resumes a stopped target (equivalent of DebugAdapter::Go()). Like Launch/Attach, this only
// confirms the stub accepted the request -- the next stop is reported separately and
// asynchronously as a TargetStoppedEvent, never inline in this response.
message GoRequest {}
message GoResponse {bool success = 1;}

enum BreakpointType {
    BREAKPOINT_TYPE_SOFTWARE = 0;
    BREAKPOINT_TYPE_HARDWARE_EXECUTE = 1;
    BREAKPOINT_TYPE_HARDWARE_READ = 2;
    BREAKPOINT_TYPE_HARDWARE_WRITE = 3;
    BREAKPOINT_TYPE_HARDWARE_ACCESS = 4;
}

message SetBreakpointRequest {
    uint64 address = 1;
    BreakpointType type = 2;
}
message SetBreakpointResponse {
    bool success = 1;
    uint64 breakpoint_id = 2;
}

enum StopReason{
    STOP_REASON_UNKNOWN = 0;
    STOP_REASON_BREAKPOINT = 1;
    STOP_REASON_SINGLE_STEP = 2;
    // The very first breakpoint hit after Launch/Attach (the OS-injected loader breakpoint,
    // not a user-set one). Binary Ninja's DebugStopReason distinguishes this from an ordinary
    // STOP_REASON_BREAKPOINT (see DebugStopReason::InitialBreakpoint) -- report it exactly
    // once per session, the first time any breakpoint exception is seen, regardless of address.
    STOP_REASON_INITIAL_BREAKPOINT = 3;
}

message TargetStoppedEvent {StopReason reason = 1; uint64 address = 2;}